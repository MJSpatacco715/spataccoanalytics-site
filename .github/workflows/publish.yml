# Keeps the NFL tools on spataccoanalytics.com/tools/ current, for free.
#
# Each run reads the source platform's repository (read-only token), builds
# the working public editions of its three tools from its current code and
# data (live/build.mjs), opens them in a browser (live/smoke.mjs), rebuilds
# the site around them and deploys it over SSH, the same way the Saratoga
# dashboard deploys. Their live data comes through the site's own relay
# (live/feed.php), whose config this writes beside the web root. If the tools
# do not build or do not pass the browser check, the pages show fresh
# screenshots instead for that run. Nothing is written to the source platform.
#
# Cadence follows the source platform: hourly, and every 15 minutes through
# Sunday afternoon and evening and the Monday and Thursday night games.
# GitHub may start scheduled runs late; nothing depends on exact timing.
#
# Secrets: DEPLOY_SSH_KEY and DEPLOY_SSH_PASSPHRASE (the same key the
# Saratoga deploy uses), SOURCE_REPO_TOKEN (read-only) and SOURCE_SITE_URL.
# Everything else is plain configuration in config/hosting.json.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'           # hourly
    - cron: '2,32,47 16-23 * * 0'  # Sunday, noon to 8 PM ET (with :17, every 15 min)
    - cron: '2,32,47 0-4 * * 1'    # Sunday night game
    - cron: '2,32,47 23 * * 1,4'   # Monday and Thursday night games
    - cron: '2,32,47 0-3 * * 2,5'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write   # the monthly keep-alive commit only

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide whether to run
        id: gate
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SRC: ${{ secrets.SOURCE_REPO_TOKEN }}
          SITE: ${{ secrets.SOURCE_SITE_URL }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SRC" ]; then
            echo "::notice::Deploy or source secrets are not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f site/.imported ]; then
            echo "::notice::The live site has not been imported into site/ yet. Run the Import live site workflow first; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "source_repo=$(jq -r .source.repo config/hosting.json)" >> "$GITHUB_OUTPUT"
          # The denylist for copy and screenshots: the committed words, plus the
          # source site's own host name, which is never written into this repo.
          host=$(printf '%s' "$SITE" | sed -E 's#^[a-z]+://##; s#[:/].*$##; s#^www\.##; s#\..*$##')
          list=$(jq -r '.denylist | join(",")' config/hosting.json)
          if [ -n "$host" ]; then echo "::add-mask::$host"; list="$list,$host"; fi
          echo "COPY_DENYLIST=$list" >> "$GITHUB_ENV"

      - name: Check out the source platform (read-only)
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.gate.outputs.source_repo }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 400
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Install tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install jsonschema==4.23.0 pillow==11.0.0
          npm install --prefix capture --no-audit --no-fund
          npm install --prefix live --no-audit --no-fund
          npx --yes playwright@1.48.2 install --with-deps chromium

      - name: Live numbers and dates
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/source_metrics.py source build/metrics.json > /dev/null

      - name: Screenshots
        if: steps.gate.outputs.skip != 'true'
        env:
          SOURCE_SITE_DIR: ${{ github.workspace }}/source/site
          SOURCE_SITE_URL: ${{ secrets.SOURCE_SITE_URL }}
          OUT_DIR: build/shots
        run: node capture/capture.mjs

      - name: The live tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          # Built from the source's code and data, then opened in a browser.
          # Either failing is loud, and the pages fall back to the screenshots.
          if node live/build.mjs --source source --out build/live && node live/smoke.mjs --live build/live; then
            echo "The live tools built and drew."
          else
            echo "::warning::The live tools did not build or did not pass the browser check; this run's pages show screenshots."
            rm -rf build/live
          fi

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scripts/build_site.py --site site --out dist --live build/live
          python scripts/validate_showcase.py --html dist/tools/football
          if grep -rlE 'sgcaptcha|/cdn-cgi/' dist --include=*.html; then
            echo "::error::A page holds a bot-check or CDN artifact; refusing to deploy it."; exit 1
          fi

      - name: Set up the SSH key
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        run: bash scripts/ssh_key.sh

      - name: Live relay config
        if: steps.gate.outputs.skip != 'true'
        env:
          SITE: ${{ secrets.SOURCE_SITE_URL }}
        run: |
          # The source's address and the denylist, one level above the web root
          # where feed.php reads them and the web cannot. Sent on stdin, never
          # on a command line; readable by this account alone.
          [ -n "$SITE" ] || { echo "::warning::SOURCE_SITE_URL is not set; the live tools will show their files' data only."; exit 0; }
          HOST=$(jq -r .ssh.host config/hosting.json)
          USER=$(jq -r .ssh.user config/hosting.json)
          port=$(jq -r .ssh.port config/hosting.json)
          web=$(jq -r .paths.web_root config/hosting.json)
          cfg="$(dirname "$web")/sa-feed.json"
          jq -n --arg base "$SITE" --arg deny "$COPY_DENYLIST" '{base: $base, deny: ($deny | split(",") | map(select(length > 0)))}' \
            | ssh -o ConnectionAttempts=8 -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port" "$USER@$HOST" \
                "umask 077 && cat > '$cfg.tmp' && mv '$cfg.tmp' '$cfg'"
          echo "Relay config written beside the web root."

      - name: Project pricing
        if: steps.gate.outputs.skip != 'true'
        env:
          PRICING: ${{ secrets.SERVICE_PRICING }}
        run: |
          # The project prices the services page gives out after an email is
          # left. They are not in this repository: they come from a secret and
          # are written one level above the web root, where pricing.php reads
          # them and the web cannot. Sent on stdin; readable by this account alone.
          [ -n "$PRICING" ] || { echo "::warning::SERVICE_PRICING is not set; the services page will take pricing requests and say pricing follows by email."; exit 0; }
          shape='(.audit | has("professional") and has("complete")) and ([.design, .crm] | all(has("essential") and has("professional") and has("complete"))) and ([.audit[], .design[], .crm[]] | all(type == "number" and . == floor and . > 0))'
          printf '%s' "$PRICING" | jq -e "$shape" >/dev/null 2>&1 || { echo "::error::SERVICE_PRICING is not the expected JSON (audit: professional, complete; design and crm: essential, professional, complete; whole dollars)."; exit 1; }
          HOST=$(jq -r .ssh.host config/hosting.json)
          USER=$(jq -r .ssh.user config/hosting.json)
          port=$(jq -r .ssh.port config/hosting.json)
          web=$(jq -r .paths.web_root config/hosting.json)
          cfg="$(dirname "$web")/sa-pricing.json"
          printf '%s' "$PRICING" | jq -c '{audit: {professional: .audit.professional, complete: .audit.complete}, design: {essential: .design.essential, professional: .design.professional, complete: .design.complete}, crm: {essential: .crm.essential, professional: .crm.professional, complete: .crm.complete}}' \
            | ssh -o ConnectionAttempts=8 -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port" "$USER@$HOST" \
                "umask 077 && cat > '$cfg.tmp' && mv '$cfg.tmp' '$cfg'"
          echo "Project pricing written beside the web root."

      - name: Stat bank access
        if: steps.gate.outputs.skip != 'true'
        env:
          BANK_PASSWORD: ${{ secrets.BANK_PASSWORD }}
          BANK_TOKEN: ${{ secrets.BANK_TOKEN }}
        run: |
          # Who may open the private stat bank (/bank/): the owner's password
          # and the weekly routine's token. Neither is in this repository:
          # they come from secrets and are written one level above the web
          # root, where bank/api.php reads them and the web cannot. Sent on
          # stdin; readable by this account alone. With no password the bank
          # stays closed to everyone.
          [ -n "$BANK_PASSWORD" ] || { echo "::warning::BANK_PASSWORD is not set; the stat bank stays closed."; exit 0; }
          [ "${#BANK_PASSWORD}" -ge 10 ] || { echo "::error::BANK_PASSWORD must be at least 10 characters."; exit 1; }
          if [ -n "$BANK_TOKEN" ] && [ "${#BANK_TOKEN}" -lt 24 ]; then echo "::error::BANK_TOKEN must be at least 24 characters."; exit 1; fi
          HOST=$(jq -r .ssh.host config/hosting.json)
          USER=$(jq -r .ssh.user config/hosting.json)
          port=$(jq -r .ssh.port config/hosting.json)
          web=$(jq -r .paths.web_root config/hosting.json)
          cfg="$(dirname "$web")/sa-bank.json"
          jq -n --arg p "$BANK_PASSWORD" --arg t "$BANK_TOKEN" '{password: $p, token: $t}' \
            | ssh -o ConnectionAttempts=8 -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port" "$USER@$HOST" \
                "umask 077 && cat > '$cfg.tmp' && mv '$cfg.tmp' '$cfg'"
          echo "Stat bank access written beside the web root."

      - name: Market strip key
        if: steps.gate.outputs.skip != 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          # The homepage's market strip takes its oil and gasoline prices from
          # the Energy Information Administration, which asks for a free key.
          # The key is not in this repository: it comes from a secret and is
          # written one level above the web root, where lib/market.php reads
          # it and the web cannot. Sent on stdin; readable by this account
          # alone. Without it the strip shows its other figures.
          [ -n "$EIA_API_KEY" ] || { echo "::notice::EIA_API_KEY is not set; the market strip shows no oil or gasoline price."; exit 0; }
          if ! printf '%s' "$EIA_API_KEY" | grep -Eq '^[A-Za-z0-9]{20,80}$'; then
            echo "::warning::EIA_API_KEY is not in the form of a key (letters and digits only); the market strip shows no oil or gasoline price."
            exit 0
          fi
          HOST=$(jq -r .ssh.host config/hosting.json)
          USER=$(jq -r .ssh.user config/hosting.json)
          port=$(jq -r .ssh.port config/hosting.json)
          web=$(jq -r .paths.web_root config/hosting.json)
          cfg="$(dirname "$web")/sa-market.json"
          jq -n --arg k "$EIA_API_KEY" '{eia_key: $k}' \
            | ssh -o ConnectionAttempts=8 -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port" "$USER@$HOST" \
                "umask 077 && cat > '$cfg.tmp' && mv '$cfg.tmp' '$cfg'"
          echo "Market strip key written beside the web root."

      - name: Deploy
        if: steps.gate.outputs.skip != 'true'
        run: |
          HOST=$(jq -r .ssh.host config/hosting.json)
          USER=$(jq -r .ssh.user config/hosting.json)
          port=$(jq -r .ssh.port config/hosting.json)
          web=$(jq -r .paths.web_root config/hosting.json)
          priv=$(jq -r .paths.private config/hosting.json)
          never=$(jq -r '.never_touch | join(" ")' config/hosting.json)
          ssh_opts="-o ConnectionAttempts=8 -o ConnectTimeout=25 -i $HOME/.ssh/deploy_key -p $port"
          ( cd dist && find . -type f | sed 's#^\./##' | sort > ../incoming.txt && tar -czf ../incoming.tgz -T ../incoming.txt )
          ssh $ssh_opts "$USER@$HOST" "mkdir -p '$priv' && chmod 700 '$priv'"
          scp -q -o ConnectionAttempts=8 -o ConnectTimeout=25 -i ~/.ssh/deploy_key -P "$port" \
            incoming.tgz incoming.txt "$USER@$HOST:$priv/"
          ssh $ssh_opts "$USER@$HOST" bash -s -- "$web" "$priv" "'$never'" < scripts/remote_deploy.sh

      - name: Verify on the server
        if: steps.gate.outputs.skip != 'true'
        run: |
          # The host's bot check answers runners over HTTP, so check the files
          # where they are served from.
          HOST=$(jq -r .ssh.host config/hosting.json)
          USER=$(jq -r .ssh.user config/hosting.json)
          port=$(jq -r .ssh.port config/hosting.json)
          web=$(jq -r .paths.web_root config/hosting.json)
          ssh -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port" "$USER@$HOST" bash -s -- "$web" <<'REMOTE'
          set -eu
          root="$HOME/$1"
          grep -q 'sa-tools:nfl-cards:start' "$root/tools/index.html"
          grep -q 'class="scorecard"' "$root/tools/index.html"
          for f in nfl-lines-tracker nfl-injury-tracker nfl-depth-charts; do test -s "$root/tools/football/$f.html"; done
          test -d "$root/saratoga" && echo "saratoga/ still present"
          # The relay, end to end from the server: one call through feed.php.
          live="$root/tools/football/live"
          if [ -f "$live/feed.php" ]; then
            out=$(cd "$live" && php -r '$_SERVER["DOCUMENT_ROOT"] = $argv[1]; $_GET = ["a" => "referees"]; include "feed.php";' "$root" 2>/dev/null | head -c 200)
            case "$out" in
              *'"ok":true'*) echo "The live relay answers." ;;
              *) echo "::warning::The live relay did not answer with data: ${out:0:80}" ;;
            esac
          fi
          # The market strip, from the server: which figures its sources gave.
          if [ -f "$root/market/feed.php" ]; then
            out=$(cd "$root/market" && php -r '$_SERVER["DOCUMENT_ROOT"] = $argv[1]; $_SERVER["REQUEST_METHOD"] = "GET"; include "feed.php";' "$root" 2>/dev/null \
              | php -r '$d = json_decode(stream_get_contents(STDIN), true); echo is_array($d) ? implode(" ", array_column($d["items"] ?? [], "id")) : "";' 2>/dev/null)
            n=$(printf '%s' "$out" | wc -w)
            if [ "$n" -ge 3 ]; then echo "The market strip has $n figures: $out"; else echo "::warning::The market strip has only $n figures ($out); it stays hidden under three."; fi
            # What each source last did (no key and no address is in this), and
            # how the energy source answers this server with no key at all: a
            # quick 403 means it is reachable.
            (cd "$root/market" && php -r '$_SERVER["DOCUMENT_ROOT"] = $argv[1]; require "../lib/market.php"; foreach (market_status() as $k => $v) { echo "  ", $k, ": ", is_array($v) ? $v["figures"] . " figure(s), answered " . $v["answered"] . ", tried " . $v["tried"] . ($v["why"] !== "" ? ", last failure: " . $v["why"] : "") : $v, "\n"; }' "$root" 2>/dev/null) || true
            for v in -4 -6; do
              curl $v -s -m 20 -o /dev/null -w "  energy source over IPv${v#-}: HTTP %{http_code}, connect %{time_connect}s, first byte %{time_starttransfer}s, total %{time_total}s\n" https://api.eia.gov/v2/ 2>/dev/null || echo "  energy source over IPv${v#-}: no answer in 20s"
            done
          fi
          echo "Verified on the server."
          REMOTE

      - name: Tell Bing what changed
        # IndexNow: Bing, and the engines that share it, fetch a changed page
        # at once. Only pages the sitemap lists are named. Google does not
        # take part: it reads the sitemap. This never fails a publish.
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' > changed.txt
          python scripts/indexnow.py --site site --dist dist < changed.txt > indexnow.json
          if [ ! -s indexnow.json ]; then echo "No page changed: nothing to tell."; exit 0; fi
          code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @indexnow.json https://api.indexnow.org/indexnow)
          echo "IndexNow answered $code for: $(jq -r '.urlList | join(" ")' indexnow.json)"
          case "$code" in 200|202) ;; *) exit 1 ;; esac

      - name: Keep the schedule alive
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'schedule'
        run: |
          # GitHub turns off scheduled workflows in a public repository after
          # 60 days without activity. One small commit a month counts.
          month=$(date -u +%Y-%m)
          if [ "$(cat .github/keepalive 2>/dev/null)" != "$month" ]; then
            echo "$month" > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Keep the publish schedule alive ($month)" && git push origin HEAD:main
          fi

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key incoming.tgz incoming.txt
