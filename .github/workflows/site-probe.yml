# Fetches live public files of the main site from a GitHub runner (the agent
# container cannot reach the site) and commits them under reference/live/ on
# the branch that ran it, so a session can build against the real markup.
# Run by hand only. A file the host's bot check withholds keeps its last copy,
# so a bad run never deletes the reference CI builds from.
# A real browser is used because the host answers plain HTTP clients with a
# bot check. Reads the site only; the one write is that commit to this repo.
name: Site probe

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Space-separated paths to fetch
        default: / /tools/ /contact/ /css/shared.css /js/shared.js
      shots:
        description: Space-separated pages to screenshot as a visitor sees them (saved under reference/live/shots/)
        default: ''
      feed:
        description: "yes = check whether the host (and a runner) can read the source platform's public data, instead of fetching pages"
        default: 'no'

permissions:
  contents: write

jobs:
  # Can this site's own server read the source platform's public data calls
  # (the ones its pages make for a signed-out visitor)? Prints only whether
  # each answered with data: status, type, size, time, and whether a bot check
  # answered instead. Never the data, never the address.
  feed:
    if: inputs.feed == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
        run: bash scripts/ssh_key.sh
      - name: Read the feed from the host and from a runner
        env:
          SITE: ${{ secrets.SOURCE_SITE_URL }}
        run: |
          [ -n "$SITE" ] || { echo "::error::SOURCE_SITE_URL is not set"; exit 1; }
          h=$(printf '%s' "$SITE" | sed -E 's#^[a-z]+://##; s#/.*$##'); echo "::add-mask::$h"
          base="${SITE%/}/api.php?action="
          cat > check.sh <<'SH'
          base="$1"
          for a in odds_get odds_ticks injuries referees; do
            f=$(mktemp)
            m=$(curl -s -m 30 -A 'Mozilla/5.0 (compatible; SpataccoAnalytics feed check)' -H 'Accept: application/json' \
                  -o "$f" -w '%{http_code} %{content_type} %{size_download}B %{time_total}s' "$base$a")
            bot=no; grep -q sgcaptcha "$f" && bot=yes
            keys=$(php -r '$j=json_decode(file_get_contents($argv[1]),true); echo is_array($j)?implode(",",array_slice(array_keys($j),0,8)):"not json";' "$f" 2>/dev/null || echo "no php")
            echo "$a: $m bot-check=$bot keys=[$keys]"
            rm -f "$f"
          done
          SH
          HOST=$(jq -r .ssh.host config/hosting.json); USER=$(jq -r .ssh.user config/hosting.json); port=$(jq -r .ssh.port config/hosting.json)
          echo "== from this site's server"
          ssh -o ConnectTimeout=25 -i ~/.ssh/deploy_key -p "$port" "$USER@$HOST" bash -s -- "$base" < check.sh
          echo "== from a GitHub runner"
          sudo apt-get install -y -q php-cli >/dev/null 2>&1 || true
          bash check.sh "$base"
      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy_key

  probe:
    if: inputs.feed != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Fetch the files
        env:
          BASE: https://spataccoanalytics.com
          PATHS: ${{ inputs.paths || '/ /tools/ /contact/ /css/shared.css /js/shared.js' }}
          SHOTS: ${{ inputs.shots }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          from playwright.sync_api import sync_playwright
          base, paths = os.environ['BASE'], os.environ['PATHS'].split()
          root = pathlib.Path('reference/live')
          def dest(p):
              rel = p.lstrip('/')
              if rel == '' or rel.endswith('/'):
                  rel += 'index.html'
              return root / rel
          with sync_playwright() as pw:
              b = pw.chromium.launch()
              ctx = b.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36')
              page = ctx.new_page()
              # Links found before are kept alongside today's, so a page the
              # bot check withheld does not drop its links from the list.
              prev = root / 'LINKS.txt'
              links = set(prev.read_text().split()) if prev.exists() else set()
              for p in paths:
                  out = dest(p); out.parent.mkdir(parents=True, exist_ok=True)
                  if out.suffix == '.html':
                      # A page navigation runs the host's bot check in the
                      # browser; wait for it to hand over the real page.
                      page.goto(base + p, wait_until='domcontentloaded', timeout=60000)
                      body = b''
                      for _ in range(15):
                          try:
                              page.wait_for_load_state('networkidle', timeout=15000)
                          except Exception:
                              pass
                          page.wait_for_timeout(2000)
                          if 'sgcaptcha' in page.url:
                              continue
                          # The browser now holds the host's pass; fetch the raw
                          # file with it rather than the script-modified page.
                          r = ctx.request.get(base + p, timeout=30000)
                          if b'sgcaptcha' not in r.body() and r.status == 200:
                              body = r.body(); break
                      print(f'page {p}: url now {page.url}, {"ok" if body else "still the bot check"}')
                      if not body:
                          continue
                  else:
                      r = ctx.request.get(base + p, timeout=30000)
                      body = r.body()
                      if b'sgcaptcha' in body:
                          print(f'{r.status} {p}: bot check'); continue
                  out.write_bytes(body)
                  print(f'saved {p} -> {out} ({len(body)} bytes)')
                  if out.suffix == '.html':
                      for m in re.findall(rb'(?:href|src)="([^"#]+)"', body):
                          u = m.decode('utf-8', 'replace')
                          if not re.match(r'^(https?:)?//|^(mailto|tel|javascript|data):', u):
                              links.add(u)
              (root / 'LINKS.txt').write_text('\n'.join(sorted(links)) + '\n')
              print('\n'.join(sorted(links)))
              # Screenshots of the pages as served, full length, for a session
              # that cannot reach the site to see what visitors see.
              for p in os.environ.get('SHOTS', '').split():
                  page.goto(base + p, wait_until='domcontentloaded', timeout=60000)
                  for _ in range(15):
                      try:
                          page.wait_for_load_state('networkidle', timeout=15000)
                      except Exception:
                          pass
                      page.wait_for_timeout(1500)
                      if 'sgcaptcha' not in page.url and 'sgcaptcha' not in page.content():
                          break
                  else:
                      print(f'shot {p}: still the bot check'); continue
                  # The site fades sections in as they scroll into view, so a
                  # full-page capture of an unscrolled page shows them blank.
                  # Scroll the whole page first, the way a visitor would.
                  h = page.evaluate('document.documentElement.scrollHeight')
                  for y in range(0, h + 400, 400):
                      page.evaluate(f'window.scrollTo(0, {y})'); page.wait_for_timeout(120)
                  page.evaluate('window.scrollTo(0, 0)'); page.wait_for_timeout(1200)
                  slug = re.sub(r'[^a-z0-9]+', '-', p.lower()).strip('-') or 'home'
                  out = root / 'shots' / f'{slug}.jpg'; out.parent.mkdir(parents=True, exist_ok=True)
                  page.screenshot(path=str(out), full_page=True, type='jpeg', quality=70)
                  print(f'shot {p} -> {out}')
              b.close()
          PY
      - name: Commit what was fetched
        run: |
          grep -rl sgcaptcha reference/live 2>/dev/null | xargs -r rm -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/live
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "Reference: live copy of the main site's files (fetched by Site probe)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
